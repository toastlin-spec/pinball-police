<!doctype html>

<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 50% 30%,#6a2f80 0%,#2c1238 55%,#12071a 100%);

canvas{display:block;touch-action:none}
#msg{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 120px);
  padding:8px 18px;border-radius:999px;background:rgba(20,0,24,.78);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:900;
  font-size:clamp(13px,3.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.round{position:fixed;top:max(10px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  background:rgba(20,0,24,.72);color:#fff;font-size:18px;cursor:pointer;padding:0}
#mute{left:10px}
#camBtn{right:10px}
#camBtn.on{background:#ff4f93;border-color:#fff}
#camPanel{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100vw - 20px));
  box-sizing:border-box;padding:10px 14px 12px;border-radius:16px;background:rgba(20,0,24,.86);border:2px solid rgba(255,255,255,.3);
  color:#fff;font-size:14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}

  #camPanel{left:auto;right:10px;bottom:auto;top:62px;transform:none;width:300px}

}

  font:700 13px inherit;font-family:inherit;cursor:pointer}

  -webkit-text-stroke:3px #3a0016;text-shadow:0 0 22px rgba(255,255,255,.9),0 7px 0 #3a0016;pointer-events:none;white-space:nowrap;opacity:0}

  30%{transform:translate(-50%,-50%) scale(1.06)}38%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}

  align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;text-shadow:0 1px 3px #000}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<div id="msg"></div>
<button id="mute" class="round" aria-label="音效開關">🔊</button>
<button id="camBtn" class="round" aria-label="調整視角">🎥</button>
<div id="camPanel">
  <div class="hint">拖曳畫面旋轉・滾輪或雙指縮放・右鍵／Shift／雙指拖曳移動</div>
  <div class="row"><label>左右角度</label><input id="cYaw" type="range" step="1"><output></output></div>
  <div class="row"><label>上下角度</label><input id="cEl" type="range" step="1"><output></output></div>
  <div class="row"><label>遠近</label><input id="cZoom" type="range" step="1"><output></output></div>
  <div class="row"><label>畫面高低</label><input id="cPy" type="range" step="1"><output></output></div>
  <div class="row"><label>畫面左右</label><input id="cPx" type="range" step="1"><output></output></div>
  <div class="presets"><button data-p="def">預設</button><button data-p="front">正面</button><button data-p="top">俯視</button><button data-p="side">側面</button><button data-p="play">近看盤面</button></div>
  <button id="camDone">完成</button>
</div>
<div id="big"></div>
<div id="meter"><span>0%</span></div>
<div id="keys">Z 投珠　X +1　C +10　V MAX　按住空白鍵拉桿　M 靜音</div>
<div id="err">3D 引擎載入失敗。<br>第一次開啟需要連上網路，請確認網路後重新整理。</div>
<script>
'use strict';
if (!window.THREE) { document.getElementById('err').style.display = 'flex'; throw new Error('three.js not loaded'); }
const V3 = THREE.Vector3;
/* =========================================================
   彈珠戰警 3D — 小鋼珠彈珠台模擬
   投珠 → 抽倍率並亮燈 → 可加碼(最高99) → 拉桿發射 → 落入亮燈格中獎
   物理在盤面平面上以像素座標計算，畫面用 Three.js 呈現
   ========================================================= */

/* ---------- 盤面幾何（像素座標） ---------- */
const BR = 6;
const AC = { x: 240, y: 420 }, AR = 210;
const LEFT_X = 30, LANE_X = 420, RIGHT_X = 450;
const FLOOR_Y = 780, POCKET_TOP = 732, NP = 15, PW = (LANE_X - LEFT_X) / NP;
const LANE_CX = 435, PLUNGER_REST = 842, BALL_REST = PLUNGER_REST - BR, LANE_BOT = 870;
const DIV_TOP = 450;
const GATE_TOP = AC.y - Math.sqrt(AR * AR - (LANE_X - AC.x) ** 2);
const G = 820, E_PIN = 0.5, E_WALL = 0.4, E_KICK = 0.85;
const PULL_MAX = 80, VMIN = 860, VMAX = 1140;
const BOARD_BOT = 872;                         // 盤面下緣（像素）

/* ---------- 規則 ---------- */
const MULTS = [2, 3, 4, 6, 8, 10];
const COUNT = { 2: 4, 3: 3, 4: 3, 6: 2, 8: 1, 10: 1 };
const WEIGHT = { 2: 28, 3: 22, 4: 18, 6: 14, 8: 10, 10: 8 };
const MCOL = { 2: '#3ddc4a', 3: '#22d3ee', 4: '#3b82f6', 6: '#b45cff', 8: '#ff8a00', 10: '#ff2d55' };
const MAX_BET = 99;

/* ---------- 碰撞物件 ---------- */
const segs = [], pins = [];
function seg(x1, y1, x2, y2, opt) { segs.push(Object.assign({ x1, y1, x2, y2 }, opt || {})); }
function pin(x, y, r, kind) { pins.push({ x, y, r, kind, glow: 0 }); }
function segDist(px, py, s) {
  const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
  const t = Math.max(0, Math.min(1, ((px - s.x1) * ex + (py - s.y1) * ey) / (ex * ex + ey * ey)));
  return Math.hypot(px - s.x1 - ex * t, py - s.y1 - ey * t);
}
function hash(n) { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

(function buildField() {
  const AN = 56;
  for (let i = 0; i < AN; i++) {
    const a1 = Math.PI + Math.PI * i / AN, a2 = Math.PI + Math.PI * (i + 1) / AN;
    seg(AC.x + AR * Math.cos(a1), AC.y + AR * Math.sin(a1), AC.x + AR * Math.cos(a2), AC.y + AR * Math.sin(a2), { arc: true });
  }
  seg(LEFT_X, AC.y, LEFT_X, FLOOR_Y, { outer: -1 });
  seg(RIGHT_X, AC.y, RIGHT_X, LANE_BOT + 40, { outer: 1 });
  seg(LANE_X, DIV_TOP, LANE_X, LANE_BOT + 40, { lane: true });
  seg(LEFT_X, FLOOR_Y, LANE_X, FLOOR_Y, { floor: true });
  seg(LANE_X, DIV_TOP, LANE_X, GATE_TOP, { oneWay: true });   // 單向閘：球進盤面後不能回發射道
  for (let i = 1; i < NP; i++) { const x = LEFT_X + PW * i; seg(x, POCKET_TOP, x, FLOOR_Y, { divider: true }); pin(x, POCKET_TOP, 3.5, 'cap'); }
  for (const y of [440, 495, 550, 605, 660]) seg(LEFT_X, y, LEFT_X + 14, y + 8, { kicker: true });
  for (const y of [490, 545, 600, 655]) seg(LANE_X, y, LANE_X - 14, y + 8, { kicker: true });
  seg(LEFT_X, 704, LEFT_X + 8, 709, { kicker: true });          // 底部小踢板，避免兩側邊格吃太多珠
  seg(LANE_X, 704, LANE_X - 8, 709, { kicker: true });
  for (const x of [120, 172, 224, 276, 328]) pin(x, 290, 4.5, 'post');
  for (let j = 0, y = 330; y <= 700; j++, y += 26) {
    const off = (j % 2) * 14;
    for (let x = 48 + off; x <= 398; x += 28) {
      if (y < AC.y + 10 && Math.hypot(x - AC.x, y - AC.y) > AR - 26) continue;
      if (hash(j * 31 + x) < 0.16) continue;
      // 與踢板保持至少一顆珠的間隙，避免卡珠
      if (segs.some(s => s.kicker && segDist(x, y, s) < 3 + BR * 2 + 1)) continue;
      pin(x, y, 3, 'nail');
    }
  }
})();

/* ---------- 物理 ---------- */
function collideCircle(b, cx, cy, cr, e) {
  const dx = b.x - cx, dy = b.y - cy, rr = cr + BR, d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr || d2 === 0) return 0;
  const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
  b.x = cx + nx * rr; b.y = cy + ny * rr;
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return 0;
  const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
  const ee = -vn < 25 ? 0 : e;
  const f = 1 - Math.min(0.12, -vn / 8000);
  const nvn = -vn * ee, nvt = vt * f;
  b.vx = nx * nvn + tx * nvt; b.vy = ny * nvn + ty * nvt;
  return -vn;
}
function collideSeg(b, s, e) {
  const ex = s.x2 - s.x1, ey = s.y2 - s.y1, L2 = ex * ex + ey * ey;
  let t = ((b.x - s.x1) * ex + (b.y - s.y1) * ey) / L2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return collideCircle(b, s.x1 + ex * t, s.y1 + ey * t, 0, e);
}
function physStep(b, dt, fx) {
  b.vy += G * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  for (const s of segs) {
    if (s.oneWay && !b.inField) continue;
    if (b.x < Math.min(s.x1, s.x2) - BR - 1 || b.x > Math.max(s.x1, s.x2) + BR + 1 ||
        b.y < Math.min(s.y1, s.y2) - BR - 1 || b.y > Math.max(s.y1, s.y2) + BR + 1) continue;
    const imp = collideSeg(b, s, s.kicker ? E_KICK : E_WALL);
    if (fx && imp > 80) sfx.wall(imp);
  }
  for (const p of pins) {
    const dx = b.x - p.x, dy = b.y - p.y, rr = p.r + BR;
    if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
    const imp = collideCircle(b, p.x, p.y, p.r, E_PIN);
    if (imp > 40) {
      b.vx += (Math.random() - 0.5) * imp * 0.12;     // 釘子微小誤差，讓落點更分散
      if (fx) { p.glow = 1; sfx.ding(imp); }
    }
  }
  if (!b.inField && b.x < LANE_X - BR - 1) b.inField = true;
}
// 回傳事件：pocket / back / oob / null
function updateBall(b, fdt, fx) {
  const n = Math.max(10, Math.ceil(fdt * 900)), dt = fdt / n;
  for (let i = 0; i < n; i++) {
    physStep(b, dt, fx);
    if (b.inField && b.y > FLOOR_Y - BR - 4 && b.x > LEFT_X && b.x < LANE_X)
      return { type: 'pocket', idx: Math.min(NP - 1, Math.max(0, Math.floor((b.x - LEFT_X) / PW))) };
    if (!b.inField && b.x > LANE_X && b.vy > 0 && b.y >= BALL_REST) return { type: 'back' };
    if (b.y > 1000 || b.x < 0 || b.x > 480 || b.y < 0) return { type: 'oob' };
  }
  const sp = Math.hypot(b.vx, b.vy);
  if (sp < 25) { b.still += fdt; if (b.still > 1.2) { b.vx += (Math.random() - 0.5) * 240; b.vy -= 120; b.still = 0; } }
  else b.still = 0;
  return null;
}
function launchVel(p) { return VMIN + p * (VMAX - VMIN) + (Math.random() - 0.5) * 30; }

/* ---------- 音效 ---------- */
let actx = null, master = null, muted = false, lastDing = 0, lastCount = 0, lastCoin = 0, nbuf = null;
function au() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
      nbuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function aok() { return actx && !muted; }
function tone(f, dur, type = 'sine', vol = 0.2, to = 0, delay = 0) {
  if (!aok()) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.2, freq = 1500, q = 1, delay = 0) {
  if (!aok()) return;
  const t = actx.currentTime + delay, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = nbuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
}
const sfx = {
  ding(imp) { if (!aok()) return; const t = actx.currentTime; if (t - lastDing < 0.02) return; lastDing = t;
    const v = Math.min(0.16, 0.02 + imp / 4000), f = 2600 + Math.random() * 1600;
    tone(f, 0.12, 'sine', v); tone(f * 1.5, 0.06, 'triangle', v * 0.3); },
  wall(imp) { if (!aok()) return; const t = actx.currentTime; if (t - lastDing < 0.03) return; lastDing = t;
    noise(0.04, Math.min(0.15, imp / 3000), 3500, 3); },
  tick() { tone(1100, 0.04, 'square', 0.05); },
  lit() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.15, 'square', 0.07, 0, i * 0.07)); },
  ratchet() { noise(0.02, 0.08, 2500, 4); tone(600, 0.02, 'square', 0.03); },
  spring() { tone(180, 0.15, 'sawtooth', 0.06, 90); noise(0.08, 0.1, 800, 1); },
  launch(p) { noise(0.12, 0.25, 600, 0.8); tone(140, 0.18, 'sine', 0.25, 60); tone(900, 0.25, 'triangle', 0.05 * (1 + p), 2400); },
  win(m) { const seq = m >= 8 ? [523, 659, 784, 1047, 784, 1047, 1319, 1568] : [523, 659, 784, 1047, 1319];
    seq.forEach((f, i) => { tone(f, 0.18, 'square', 0.07, 0, i * 0.09); tone(f * 2, 0.12, 'sine', 0.04, 0, i * 0.09); }); },
  lose() { tone(440, 0.18, 'square', 0.05); tone(330, 0.3, 'square', 0.05, 0, 0.16); },
  drop() { tone(320, 0.12, 'sine', 0.2, 160); noise(0.06, 0.12, 1200, 2); },
  deny() { tone(200, 0.12, 'square', 0.05); },
  back() { tone(250, 0.2, 'triangle', 0.08, 150); },
  clink() { if (!aok()) return; const t = actx.currentTime; if (t - lastCount < 0.03) return; lastCount = t;
    const f = 3000 + Math.random() * 1800; tone(f, 0.07, 'sine', 0.07); tone(f * 0.62, 0.05, 'triangle', 0.03); },
  coin() { if (!aok()) return; const t = actx.currentTime; if (t - lastCoin < 0.05) return; lastCoin = t;
    tone(2600, 0.08, 'sine', 0.08); noise(0.03, 0.06, 5000, 2); },
  popper() { noise(0.18, 0.35, 900, 0.7); tone(220, 0.12, 'sine', 0.2, 80); noise(0.4, 0.06, 6000, 1, 0.05); },
  // 群眾歡呼：濾波噪音模擬人聲＋「哇～」母音＋掌聲＋口哨
  cheer(power) {
    if (!aok()) return;
    const t0 = actx.currentTime + 0.05, dur = 2.2 + power * 2;
    const vol = 0.05 + power * 0.05;
    for (let i = 0; i < 9; i++) {
      const s = actx.createBufferSource(); s.buffer = nbuf; s.loop = true;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
      const f0 = 450 + Math.random() * 900; bp.frequency.setValueAtTime(f0, t0); bp.frequency.linearRampToValueAtTime(f0 * 1.35, t0 + 0.6);
      bp.frequency.linearRampToValueAtTime(f0, t0 + dur); bp.Q.value = 3 + Math.random() * 5;
      const g = actx.createGain(), am = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
      lfo.frequency.value = 3 + Math.random() * 6; lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain); am.gain.value = 0.7;
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.2 + Math.random() * 0.3);
      g.gain.setValueAtTime(vol, t0 + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(bp); bp.connect(am); am.connect(g); g.connect(master);
      s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.1); lfo.start(t0); lfo.stop(t0 + dur + 0.1);
    }
    const voices = 5 + Math.round(power * 5);
    for (let i = 0; i < voices; i++) {
      const st = t0 + Math.random() * 0.5, vd = 0.8 + Math.random() * 0.9;
      const o = actx.createOscillator(); o.type = 'sawtooth';
      const p0 = 190 + Math.random() * 230;
      o.frequency.setValueAtTime(p0, st); o.frequency.linearRampToValueAtTime(p0 * 1.45, st + vd * 0.35); o.frequency.linearRampToValueAtTime(p0 * 1.1, st + vd);
      const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 5 + Math.random() * 2; vg.gain.value = p0 * 0.03;
      vib.connect(vg); vg.connect(o.frequency);
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.025 + power * 0.015, st + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, st + vd);
      for (const [ff, qq, gg] of [[750, 8, 1], [1200, 9, 0.6], [2600, 10, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff * (0.9 + Math.random() * 0.2); bp.Q.value = qq;
        const fg = actx.createGain(); fg.gain.value = gg; o.connect(bp); bp.connect(fg); fg.connect(g);
      }
      g.connect(master); o.start(st); o.stop(st + vd + 0.05); vib.start(st); vib.stop(st + vd + 0.05);
    }
    const claps = Math.round(dur * (35 + power * 50));
    for (let i = 0; i < claps; i++)
      noise(0.025 + Math.random() * 0.02, 0.025 + Math.random() * 0.05, 1200 + Math.random() * 2500, 0.9, 0.15 + Math.random() * dur * 0.85);
    const wh = power >= 0.8 ? 3 : power >= 0.4 ? 2 : 1;
    for (let i = 0; i < wh; i++) {
      const st = 0.25 + i * 0.55 + Math.random() * 0.2;
      tone(1700 + Math.random() * 300, 0.25, 'sine', 0.045, 2900, st);
      tone(2900, 0.35, 'sine', 0.04, 2100, st + 0.25);
    }
  }
};
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- 出珠盤（3D 堆疊位置，單位：公尺級場景單位） ---------- */
const TRAY_IN = { w: 4.2, d: 0.92 };
const TR3 = 0.052;
const PILE3 = [];                              // 由出珠口附近往外、往上堆成小山
(function buildPile() {
  const r = TR3, dz = r * Math.sqrt(3), dy = r * 2 * Math.sqrt(2 / 3);
  for (let L = 0; L < 5; L++) {
    const ox = (L % 2) * r, oz = (L % 2) * dz / 3;
    for (let iz = 0; ; iz++) {
      const z = -TRAY_IN.d / 2 + r + iz * dz + oz; if (z > TRAY_IN.d / 2 - r) break;
      for (let ix = 0; ; ix++) {
        const x = -TRAY_IN.w / 2 + r + ix * 2 * r + (iz % 2) * r + ox; if (x > TRAY_IN.w / 2 - r) break;
        const dist = Math.hypot(x * 0.9, (z + 0.38) * 1.5);
        PILE3.push({ x, y: r + L * dy, z, s: L * 0.5 + dist + Math.sin(x * 13 + z * 7 + L) * 0.04 });
      }
    }
  }
  PILE3.sort((a, b) => a.s - b.s);
})();

function shuffleLit(k) {
  const a = [...Array(NP).keys()];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return new Set(a.slice(0, k));
}
// 亮燈格平均分散：等距排列再隨機整體旋轉，每一格被點亮的機率相同
const MIN_GAP = { 1: 0, 2: 5, 3: 4, 4: 3 };
function spreadLit(k) {
  const z = NP / k;
  for (let tries = 0; tries < 30; tries++) {
    const off = Math.random() * NP, jit = tries < 29 ? 0.9 : 0;
    const a = [...Array(k).keys()].map(i => ((Math.floor(off + i * z + (Math.random() * 2 - 1) * jit)) % NP + NP) % NP).sort((x, y) => x - y);
    const gaps = a.map((v, i) => (i ? v - a[i - 1] : v + NP - a[k - 1]));
    if (k === 1 || gaps.every(g => g >= MIN_GAP[k])) return new Set(a);
  }
}

}

// 從出珠盤拿珠，飛進投珠口
function takeBalls(n) {

    balls--;

    const from = trayGroup.localToWorld(new V3(slot.x, slot.y, slot.z));
    flyers.push({ kind: 'in', from, t: -Math.min(i, 40) * 0.03, dur: 0.6 });

  flyers.push({ kind: 'out', sx, sy: 0.4, sz, tx: slot.x, ty: slot.y, tz: slot.z, t: 0,

}
function insert() {
  if (state === 'RESULT') { if (canSkip()) endRound(); else return; }
  if (state === 'IDLE') {
    if (busyPayout()) { say('出珠中，請稍候', '#fc6'); return; }
    if (balls <= 0) { pending += 100; save(); say('補充 100 顆小鋼珠！', '#8ff'); return; }
    takeBalls(1); bet = 1; startRoll(); return;

}
function addBet(n) {

  if (state === 'IDLE') {
    if (busyPayout()) { say('出珠中，請稍候', '#fc6'); return; }
    if (balls <= 0) { sfx.deny(); say('珠子用完了，按「補珠」領 100 顆', '#fc6'); return; }
    insert(); n -= 1; if (n <= 0) return;
  }
  if (state !== 'ROLL' && state !== 'READY') return;
  const add = Math.min(n, MAX_BET - bet, balls);
  if (add <= 0) { sfx.deny(); say(bet >= MAX_BET ? '已達最高押注 99 顆' : '珠子不夠了', '#fc6'); return; }
  takeBalls(add); bet += add;

}
function release() {

}
function onBallEvent(r) {

const POWER = { 2: 0.2, 3: 0.3, 4: 0.45, 6: 0.6, 8: 0.85, 10: 1 };

/* ---------- 更新 ---------- */
function update(fdt) {
  T += fdt;
  if (keyPull) pull = Math.min(PULL_MAX, pull + PULL_MAX * fdt / 1.0);
  if (keyPull || dragging) {
    pullVis = pull;
    if (Math.abs(pull - lastRatchet) >= 10) { lastRatchet = Math.round(pull / 10) * 10; sfx.ratchet(); }
  } else { pullVis = Math.max(0, pullVis - fdt * 1400); lastRatchet = 0; }

  if (state === 'ROLL') {
    rollT += fdt;
    if (rollT >= rollNext) {
      if (rollT > 1.3 && rollIdx === targetIdx) {
        mult = MULTS[targetIdx]; lit = spreadLit(COUNT[mult]); state = 'READY'; sfx.lit();
        say(`× ${mult} 倍！亮 ${lit.size} 格 — 可加碼，拉桿發射`, MCOL[mult]);
      } else {
        rollIdx = (rollIdx + 1) % 6; sfx.tick();
        rollLit = spreadLit(COUNT[MULTS[rollIdx]]);
        rollNext = rollT + 0.045 + rollT * 0.09;
      }
    }
  }
  if (state === 'FLY') {
    const r = updateBall(ball, fdt, true);
    if (r) onBallEvent(r);
  } else if (state !== 'RESULT') {
    ball.x = LANE_CX; ball.y = BALL_REST + pullVis * 0.3;
  }
  if (state === 'RESULT') {
    resT += fdt;
    if (!busyPayout() && resT > 1.2) { doneT += fdt; if (doneT > (win ? 1.2 : 0.4)) endRound(); }
  }
  // 退珠器：待退越多吐得越快
  if (pending > 0) {
    hopAcc += Math.min(150, Math.max(18, pending / 2)) * fdt;
    while (hopAcc >= 1 && pending > 0) { hopAcc--; pending--; spawnOut(); }
  } else hopAcc = 0;
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += fdt;
    if (f.t >= f.dur) {
      flyers.splice(i, 1);
      if (f.kind === 'out') { incoming--; balls++; save(); sfx.clink(); }
      else sfx.coin();
    }
  }
  for (const p of pins) if (p.glow > 0) p.glow = Math.max(0, p.glow - fdt * 4);
  for (const b of BTN) b.press = Math.max(0, b.press - fdt);
}

const SEG7 = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' };
function digit(c, x, y, w, h, ch, on) {

    a: [x + t * 0.7, y, w - t * 1.4, t], d: [x + t * 0.7, y + h - t, w - t * 1.4, t], g: [x + t * 0.7, y + h / 2 - t / 2, w - t * 1.4, t],

  if (camEdit) { camPointerDown(e); return; }
  const r = cv.getBoundingClientRect();
  mv.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mv, camera);
  const hits = ray.intersectObjects(clickables, true);
  if (hits.length) {
    let o = hits[0].object; while (o && !o.userData.id) o = o.parent;
    if (o) {
      if (o.userData.id === 'knob') startDrag(e);
      else if (o.userData.id === 'slot') press('ins');
      else press(o.userData.id);
      return;
    }
  }
  const k = toScreen(knobBall);
  if (Math.hypot(e.clientX - k.x, e.clientY - k.y) < Math.max(60, innerHeight * 0.08)) startDrag(e);
});
cv.addEventListener('pointermove', e => {
  if (ptrs.size) { e.preventDefault(); camPointerMove(e); return; }
  if (!dragging || e.pointerId !== dragId) return;
  e.preventDefault();
  pull = Math.max(0, Math.min(PULL_MAX, (e.clientY - dragStart) * PULL_MAX / Math.max(90, innerHeight * 0.14)));
});
function endDrag(e) { camPointerUp(e); if (dragging && e.pointerId === dragId) { release(); dragId = null; } }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); au(); if (!keyPull && !e.repeat) { keyPull = true; pull = 0; } return; }
  if (e.repeat) return;
  au();
  if (e.code === 'KeyZ' || e.code === 'Enter') press('ins');
  else if (e.code === 'KeyX' || e.code === 'ArrowUp') press('p1');
  else if (e.code === 'KeyC') press('p10');
  else if (e.code === 'KeyV') press('max');
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { if ((e.code === 'Space' || e.code === 'ArrowDown') && keyPull) { e.preventDefault(); release(); } });
const muteBtn = document.getElementById('mute');
function toggleMute() { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); au(); toggleMute(); });
if (!isTouch) document.getElementById('keys').style.display = 'block';

/* ---------- 測試用：離線模擬落點分布 ---------- */
window.__sim = function (power, n = 50) {
  const res = {};
  for (let k = 0; k < n; k++) {
    const b = { x: LANE_CX, y: BALL_REST, vx: (Math.random() - 0.5) * 8, vy: -launchVel(power), inField: false, still: 0 };
    let t = 0, r = null;
    while (t < 20 && !(r = updateBall(b, 1 / 60, false))) t += 1 / 60;
    const key2 = r ? (r.type === 'pocket' ? r.idx : r.type) : 'timeout';
    res[key2] = (res[key2] || 0) + 1;
  }
  return res;
};

fitCamera();
say(balls > 0 ? '投入小鋼珠開始' : '珠子用完了，按「補珠」領 100 顆', '#fff');
let last = performance.now();
function frame(now) {
  const fdt = Math.min(0.033, (now - last) / 1000); last = now;
  update(fdt); sync3D(fdt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
